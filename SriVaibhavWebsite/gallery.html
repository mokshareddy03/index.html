<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Sri Vaibhav Gents Wear</title>

    <link rel="stylesheet" href="style.css">

    <style>

    .gallery-section{
        padding:80px 20px;
        text-align:center;
        background:#f5f5f5;
    }

    .gallery-section h1{
        color:#5B2A86;
        font-size:50px;
        margin-bottom:20px;
    }

    .gallery-section p{
        font-size:22px;
        margin-bottom:50px;
    }

    .gallery-grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
        gap:25px;
        max-width:1400px;
        margin:auto;
    }

    .gallery-item{
        background:white;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 8px 20px rgba(0,0,0,0.15);
        transition:0.4s;
    }

    .gallery-item:hover{
        transform:scale(1.03);
    }

    .gallery-item img{
        width:100%;
        height:350px;
        object-fit:cover;
    }

    .gallery-item h3{
        padding:15px;
        color:#5B2A86;
    }

    </style>

</head>

<body>

<nav>
    <div class="logo-section">
        <img src="images/logo.png" alt="Logo">
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html">Collections</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<section class="gallery-section">

    <h1>Our Gallery</h1>

    <p>Explore Our Premium Fashion Collections</p>

    <div class="gallery-grid">

        <div class="gallery-item">
            <img src="images/Plane Shirt.jpeg">
            <h3>Plain Shirts</h3>
        </div>

        <div class="gallery-item">
            <img src="images/T Shirt.jpg">
            <h3>T-Shirts</h3>
        </div>

        <div class="gallery-item">
            <img src="images/Jeans.jpeg">
            <h3>Jeans Collection</h3>
        </div>

        <div class="gallery-item">
            <img src="images/Blazer.jpeg">
            <h3>Premium Blazers</h3>
        </div>

        <div class="gallery-item">
            <img src="images/Wedding were.jpeg">
            <h3>Wedding Wear</h3>
        </div>

        <div class="gallery-item">
            <img src="images/Kurtha.jpg">
            <h3>Kurtha Collection</h3>
        </div>

        <div class="gallery-item">
            <img src="images/Zibba.jpeg">
            <h3>Zibba Collection</h3>
        </div>

        <div class="gallery-item">
            <img src="images/Kids.jpeg">
            <h3>Kids Wear</h3>
        </div>

    </div>

</section>

<footer class="premium-footer">

    <h3>Sri Vaibhav Gents Wear & Boys Wear</h3>

    <p>Fashion For Every Age</p>

</footer>

<script src="script.js"></script>

</body>
</html>
